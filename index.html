<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Piket Kelas</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fb; color: #172033; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    .wrap { max-width: 900px; margin: auto; padding: 16px; }
    header { background: #172033; color: #fff; border-radius: 20px; padding: 22px; margin-bottom: 14px; }
    h1 { margin: 0 0 4px; font-size: 30px; }
    .muted { opacity: .72; font-size: 14px; }
    .card { background: #fff; border: 1px solid #e1e6ef; border-radius: 18px; padding: 16px; margin: 12px 0; }
    .monthbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .monthbar h2 { margin: 0; font-size: 22px; }
    button { border: 0; border-radius: 11px; padding: 10px 14px; background: #172033; color: #fff; font: inherit; cursor: pointer; }
    button.secondary { background: #edf1f7; color: #172033; }
    .danger { background: #c93636; }
    .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .dow { text-align: center; font-size: 11px; font-weight: 700; color: #667085; padding: 5px; }
    .day { min-height: 110px; border: 1px solid #e3e7ef; border-radius: 12px; padding: 7px; background: #fff; overflow: hidden; }
    .day.today { border: 2px solid #172033; }
    .empty { background: transparent; border-color: transparent; }
    .num { font-weight: 800; margin-bottom: 5px; }

    /* CSS Entry Sesuai Permintaan */
    .entry {
      font-size: 9px;
      padding: 4px;
      line-height: 1.2;
      overflow-wrap: anywhere;
      border-radius: 6px;
      margin: 3px 0;
    }
    .entry .name {
      font-weight: 600;
      display: block;
    }
    .entry .status-badge {
      font-size: 9px;
      margin-top: 2px;
      display: block;
    }

    .ok { background: #dff7e7; color: #176b35; }
    .absent { background: #fff0d8; color: #8a5a00; }
    .run { background: #ffe0e0; color: #9d2020; }
    .hidden { display: none; }
    .adminbar { display: flex; justify-content: space-between; align-items: center; }
    input, select { width: 100%; padding: 10px; border: 1px solid #d8deea; border-radius: 10px; font: inherit; background: #fff; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .member { display: grid; grid-template-columns: 1.4fr 1fr auto; gap: 8px; margin: 8px 0; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .notice { background: #fff7d8; padding: 10px; border-radius: 10px; font-size: 13px; color: #705500; }
    .legend { font-size: 13px; color: #667085; }

    @media(max-width:600px) {
      .wrap { padding: 10px; }
      .calendar { gap: 4px; }
      .day { min-height: 88px; padding: 5px; }
      .dow { font-size: 9px; }
    }
    @media(max-width:430px) {
      .member, .grid { grid-template-columns: 1fr; }
      .day { min-height: 75px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="muted">WEBSITE KELAS</div>
      <h1>Piket Kelas</h1>
      <div id="today" class="muted"></div>
    </header>

    <section id="viewer">
      <div class="card">
        <div class="monthbar">
          <button onclick="changeMonth(-1)">‹</button>
          <h2 id="monthTitle"></h2>
          <button onclick="changeMonth(1)">›</button>
        </div>
        <div class="calendar" id="calendar"></div>
      </div>
      <div class="card">
        <button class="secondary" onclick="showAdmin()">Admin</button>
        <span class="legend">&nbsp; 🟢 Piket &nbsp; 🟡 Tidak piket &nbsp; 🔴 Kabur</span>
      </div>
    </section>

    <section id="admin" class="hidden">
      <div class="card">
        <div class="adminbar">
          <strong>Panel Admin</strong>
          <button class="secondary" onclick="showViewer()">Kembali</button>
        </div>
        <p class="muted">Pilih tanggal untuk mengatur siswa dan status.</p>
        <input id="editDate" type="date" onchange="loadEditor()">
      </div>
      <div class="card">
        <strong id="editorTitle"></strong>
        <div id="adminList"></div>
        <div class="actions">
          <button onclick="addRow()">+ Tambah siswa</button>
          <button onclick="save()">Simpan</button>
          <button class="danger" onclick="deleteDate()">Hapus tanggal</button>
        </div>
      </div>
      <div class="card">
        <strong>Tambah nama siswa</strong>
        <div class="grid" style="margin-top:9px">
          <input id="newMember" placeholder="Contoh: Helmi">
          <button onclick="addMember()">Tambah</button>
        </div>
      </div>
      <div class="notice">
        Demo: data masih tersimpan di browser. Setelah Supabase dipasang, data akan tersimpan online untuk semua perangkat.
      </div>
    </section>
  </div>

  <script>
    const KEY = "piket-kelas-bulanan-v1";
    const months = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const days = ["Min","Sen","Sel","Rab","Kam","Jum","Sab"];

    let view = new Date();
    view.setDate(1);

    // Initial data dengan data tanggal "2026-10-05"
    let data = JSON.parse(localStorage.getItem(KEY) || "null") || {
      members: ["Andi", "Budi", "Citra", "Dimas", "Eka", "Helmi"],
      dates: {
        "2026-10-05": [
          {
            name: "Helmi",
            status: "piket"
          }
        ]
      }
    };

    function iso(d) {
      let x = new Date(d);
      x.setMinutes(x.getMinutes() - x.getTimezoneOffset());
      return x.toISOString().slice(0, 10);
    }

    function today() {
      return iso(new Date());
    }

    function fmt(s) {
      return new Date(s + "T00:00:00").toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    }

    function ensure(s) {
      if (!data.dates[s]) data.dates[s] = [];
      return data.dates[s];
    }

    function cls(s) {
      return s === "kabur" ? "run" : s === "tidak" ? "absent" : "ok";
    }

    function labelWithIcon(s) {
      if (s === "kabur") return "🔴 Kabur";
      if (s === "tidak") return "🟡 Tidak piket";
      return "🟢 Piket";
    }

    function esc(s) {
      return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }

    function render() {
      let t = today();
      document.getElementById("today").textContent = "Hari ini: " + fmt(t);
      document.getElementById("monthTitle").textContent = months[view.getMonth()] + " " + view.getFullYear();

      let h = days.map(x => `<div class="dow">${x}</div>`).join("");
      let first = new Date(view.getFullYear(), view.getMonth(), 1).getDay();
      let count = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();

      for (let i = 0; i < first; i++) h += '<div class="day empty"></div>';

      for (let n = 1; n <= count; n++) {
        let s = iso(new Date(view.getFullYear(), view.getMonth(), n));
        let a = data.dates[s] || [];
        
        let entries = a.length 
          ? a.map(x => `
              <div class="entry ${cls(x.status)}">
                <span class="name">${esc(x.name)}</span>
                <span class="status-badge">${labelWithIcon(x.status)}</span>
              </div>
            `).join("")
          : '<span class="muted">-</span>';

        h += `<div class="day ${s === t ? "today" : ""}"><div class="num">${n}</div>${entries}</div>`;
      }
      document.getElementById("calendar").innerHTML = h;
    }

    function changeMonth(n) {
      view.setMonth(view.getMonth() + n);
      render();
    }

    function showAdmin() {
      if (prompt("Password admin:") !== "piket123") return alert("Password salah.");
      document.getElementById("viewer").classList.add("hidden");
      document.getElementById("admin").classList.remove("hidden");
      document.getElementById("editDate").value = today();
      loadEditor();
    }

    function showViewer() {
      document.getElementById("admin").classList.add("hidden");
      document.getElementById("viewer").classList.remove("hidden");
      render();
    }

    function loadEditor() {
      let s = document.getElementById("editDate").value || today();
      let a = ensure(s);
      document.getElementById("editorTitle").textContent = "Piket " + fmt(s);
      let rows = a.length ? a : [{ name: "", status: "piket" }];
      
      document.getElementById("adminList").innerHTML = rows.map((x, i) => `
        <div class="member">
          <select onchange="nameChange(${i}, this.value)">
            <option value="">-- pilih siswa --</option>
            ${data.members.map(n => `<option value="${esc(n)}" ${n === x.name ? "selected" : ""}>${esc(n)}</option>`).join("")}
          </select>
          <select onchange="statusChange(${i}, this.value)">
            <option value="piket" ${x.status === "piket" ? "selected" : ""}>Piket</option>
            <option value="tidak" ${x.status === "tidak" ? "selected" : ""}>Tidak piket</option>
            <option value="kabur" ${x.status === "kabur" ? "selected" : ""}>Kabur</option>
          </select>
          <button class="danger" onclick="removeRow(${i})">Hapus</button>
        </div>
      `).join("");
    }

    function nameChange(i, v) {
      let a = ensure(document.getElementById("editDate").value);
      if (a[i]) a[i].name = v;
    }

    function statusChange(i, v) {
      let a = ensure(document.getElementById("editDate").value);
      if (a[i]) a[i].status = v;
    }

    function addRow() {
      ensure(document.getElementById("editDate").value || today()).push({ name: "", status: "piket" });
      loadEditor();
    }

    function removeRow(i) {
      ensure(document.getElementById("editDate").value).splice(i, 1);
      loadEditor();
    }

    function addMember() {
      let e = document.getElementById("newMember");
      let n = e.value.trim();
      if (n && !data.members.includes(n)) data.members.push(n);
      e.value = "";
      save();
    }

    function save() {
      localStorage.setItem(KEY, JSON.stringify(data));
      render();
      loadEditor();
      alert("Tersimpan.");
    }

    function deleteDate() {
      let s = document.getElementById("editDate").value;
      if (confirm("Hapus data " + fmt(s) + "?")) {
        delete data.dates[s];
        save();
      }
    }

    render();
  </script>
</body>
</html>
